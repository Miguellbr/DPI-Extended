name: Build the DPI

on:
  push:
    branches: [ DN8 ]
  pull_request:
    branches: [ DN8 ]
  workflow_dispatch:

jobs:
  build-nonmac:
    name: Build Windows / Linux / Android
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install NDK
        run: sdkmanager "ndk;24.0.8215888"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Prepare uBlock Origin core
        uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Bundle uBO core for Android
        run: |
          mkdir -p DirectPackageInstaller/DirectPackageInstaller.Android/Assets
          tmp_dir="$(mktemp -d)"
          cd "$tmp_dir"
          npm init -y >/dev/null 2>&1
          npm install @gorhill/ubo-core@0.1.30 esbuild >/dev/null 2>&1
          cat > dpi-ubo-entry.js <<'EOF'
          import * as sfp from '@gorhill/ubo-core/js/static-filtering-parser.js';
          import { CompiledListReader, CompiledListWriter } from '@gorhill/ubo-core/js/static-filtering-io.js';
          import { FilteringContext } from '@gorhill/ubo-core/js/filtering-context.js';
          import { LineIterator } from '@gorhill/ubo-core/js/text-utils.js';
          import snfe from '@gorhill/ubo-core/js/static-net-filtering.js';

          function compileList({ name, raw }, compiler, writer) {
            if (typeof raw !== 'string' || raw === '') return;
            const lineIter = new LineIterator(raw);
            if (name) writer.properties.set('name', name);
            const parser = new sfp.AstFilterParser({ maxTokenLength: snfe.MAX_TOKEN_LENGTH });
            while (lineIter.eot() === false) {
              let line = lineIter.next();
              while (line.endsWith(' \\')) {
                if (lineIter.peek(4) !== '    ') break;
                line = line.slice(0, -2).trim() + lineIter.next().trim();
              }
              parser.parse(line);
              if (parser.isFilter() === false || parser.isNetworkFilter() === false) continue;
              compiler.compile(parser, writer);
            }
            return writer.toString();
          }

          async function useLists(lists) {
            snfe.reset();
            const compiler = snfe.createCompiler();
            for (const list of lists) {
              const writer = new CompiledListWriter();
              const compiled = compileList(list, compiler, writer);
              if (compiled) snfe.fromCompiled(new CompiledListReader(compiled));
            }
            snfe.freeze();
            snfe.optimize();
          }

          const fctx = new FilteringContext();

          globalThis.DpiUbo = {
            initialize: async function(json) {
              const lists = JSON.parse(json);
              await useLists(lists);
              globalThis.DpiUboMatch = function(url, originURL, type) {
                return snfe.matchRequest(fctx.fromDetails({ url, originURL, type }));
              };
              globalThis.DpiUboRuleCount = lists.length;
            }
          };
          EOF
          npx esbuild dpi-ubo-entry.js --bundle --format=iife --outfile="$GITHUB_WORKSPACE/DirectPackageInstaller/DirectPackageInstaller.Android/Assets/ubocore.bundle.js"
          rm -f dpi-ubo-entry.js
          cd "$GITHUB_WORKSPACE"

      - name: Building
        env:
          BUILD_TARGETS: win,linux,android
        run: |
          git submodule init
          git submodule update
          dotnet workload install android
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          sh Build.cmd

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases-nonmac
          path: Release
          if-no-files-found: error
          retention-days: 7

  build-mac:
    name: Build macOS (signed)
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Building
        env:
          BUILD_TARGETS: osx
        run: |
          git submodule init
          git submodule update
          dotnet workload install android
          sh Build.cmd

      - name: Verify ad-hoc signature on arm64 .app
        run: |
          mkdir -p Release/verify
          unzip -q Release/OSX-ARM64-APP.zip -d Release/verify
          codesign -dvvv Release/verify/DirectPackageInstaller.app 2>&1 | tee /tmp/codesign.txt
          grep -q "Signature=adhoc" /tmp/codesign.txt || { echo "FAIL: arm64 .app missing ad-hoc signature"; exit 1; }
          rm -rf Release/verify

      - name: Archive production artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Releases-mac
          path: Release
          if-no-files-found: error
          retention-days: 7

  collect:
    name: Collect all artifacts
    needs: [build-nonmac, build-mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Releases-*
          path: Release
          merge-multiple: true
      - uses: actions/upload-artifact@v4
        with:
          name: Releases
          path: Release

  release:
    name: Publish GitHub Release
    needs: collect
    if: github.event_name == 'push' && github.ref == 'refs/heads/DN8'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Releases
          path: Release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          release_id="$(gh api "repos/$repo/releases/tags/v0.1.0" --jq '.id')"
          upload_url="$(gh api "repos/$repo/releases/$release_id" --jq '.upload_url' | sed 's/{?name,label}//')"

          for file in Release/*; do
            [ -f "$file" ] || continue
            name="$(basename "$file")"
            existing_id="$(gh api --paginate "repos/$repo/releases/$release_id/assets" --jq ".[] | select(.name == \"$name\") | .id" | head -n 1 || true)"
            if [ -n "$existing_id" ]; then
              gh api --method DELETE "repos/$repo/releases/assets/$existing_id"
            fi

            curl --fail-with-body --retry 3 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "Content-Type: application/zip" \
              --data-binary "@$file" \
              "$upload_url?name=$name"
          done
